<!doctype html><html><head><meta charset="utf-8"><style>
.k-stage{gap:14px}
.hd{margin:0;text-align:center;font:400 38px/1.08 var(--display);color:var(--ink)}
.board{position:relative;width:440px;height:440px;align-self:center}
.board svg{position:absolute;inset:0;width:440px;height:440px;overflow:visible}
.call{position:absolute;left:262px;display:flex;align-items:center;gap:8px}
.call span:last-child{font:700 18px/1.1 var(--body);color:var(--ink)}
.tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%)}
</style></head><body><div class="k-stage">
<h1 class="hd k-reveal" style="--d:0s">Inside a 1650 pendulum clock</h1>
<div class="board fl-push">
  <svg viewBox="0 0 440 440">
    <!-- specks for depth -->
    <g style="fill:var(--ink)">
      <circle cx="30" cy="40" r="1.6" class="fl-speck"/><circle cx="410" cy="70" r="1.3" class="fl-speck" style="--d:.7s"/>
      <circle cx="60" cy="400" r="1.4" class="fl-speck" style="--d:1.2s"/><circle cx="390" cy="380" r="1.8" class="fl-speck" style="--d:.3s"/>
    </g>
    <!-- soft halo behind the movement -->
    <circle cx="140" cy="230" r="95" class="fl-halo" style="fill:var(--accent)"/>
    <!-- LAYER 4 (bottom): back plate -->
    <g class="fl-layer" style="--dy:150px;--d:1.0s">
      <g class="fl-lift"><ellipse cx="140" cy="236" rx="112" ry="34" style="fill:color-mix(in srgb,var(--ink) 55%,var(--parch))"/>
      <path d="M28 236 a112 34 0 0 0 224 0 v12 a112 34 0 0 1 -224 0z" style="fill:color-mix(in srgb,var(--ink) 75%,var(--parch))"/></g>
    </g>
    <!-- LAYER 3: gear train, lit from the upper left -->
    <g class="fl-layer" style="--dy:62px;--d:1.4s">
      <g class="fl-lift">
        <g transform="translate(100 228)"><g class="fl-turn" style="--t:6s">
          <circle r="46" style="fill:var(--accent)"/><path d="M0 -46 A46 46 0 0 1 0 46 A30 46 0 0 0 0 -46Z" class="fl-shade"/>
          <g style="fill:var(--accent)"><rect x="-6" y="-56" width="12" height="14"/><rect x="-6" y="42" width="12" height="14"/><rect x="42" y="-6" width="14" height="12"/><rect x="-56" y="-6" width="14" height="12"/>
          <rect x="-6" y="-56" width="12" height="14" transform="rotate(45)"/><rect x="-6" y="42" width="12" height="14" transform="rotate(45)"/><rect x="42" y="-6" width="14" height="12" transform="rotate(45)"/><rect x="-56" y="-6" width="14" height="12" transform="rotate(45)"/></g>
          <circle r="9" style="fill:var(--parch)"/></g></g>
        <g transform="translate(176 214)"><g class="fl-turn ccw" style="--t:3.2s">
          <circle r="26" style="fill:color-mix(in srgb,var(--accent) 70%,var(--ink))"/><path d="M0 -26 A26 26 0 0 1 0 26 A16 26 0 0 0 0 -26Z" class="fl-shade"/>
          <g style="fill:color-mix(in srgb,var(--accent) 70%,var(--ink))"><rect x="-4" y="-33" width="8" height="9"/><rect x="-4" y="24" width="8" height="9"/><rect x="24" y="-4" width="9" height="8"/><rect x="-33" y="-4" width="9" height="8"/></g>
          <circle r="6" style="fill:var(--parch)"/></g></g>
      </g>
    </g>
    <!-- LAYER 2: escapement and pendulum -->
    <g class="fl-layer" style="--dy:-10px;--d:1.8s">
      <g class="fl-lift">
        <path d="M106 156 q34 -34 68 0 l-8 8 q-26 -22 -52 0z" style="fill:var(--ink)"/><circle cx="140" cy="140" r="7" style="fill:var(--ink)"/>
        <rect x="137" y="150" width="6" height="40" style="fill:var(--ink)"/>
      </g>
    </g>
    <!-- LAYER 1 (top): dial face with crescent shading and hands -->
    <g class="fl-layer" style="--dy:-112px;--d:2.2s">
      <g class="fl-lift">
        <ellipse cx="140" cy="210" rx="96" ry="30" style="fill:var(--bone)"/>
        <path d="M44 210 a96 30 0 0 0 192 0 a96 22 0 0 1 -192 0z" class="fl-shade"/>
        <ellipse cx="140" cy="210" rx="96" ry="30" class="fl-rim"/>
        <path d="M140 210 L170 200 M140 210 L128 192" style="stroke:var(--ink);stroke-width:4;stroke-linecap:round"/>
      </g>
    </g>
    <!-- leader lines from each lifted layer to its label -->
    <g style="stroke:var(--ink);stroke-width:1.5;fill:none" opacity=".7">
      <path d="M236 98 H258" pathLength="1" class="fl-line" style="--d:2.9s"/>
      <path d="M178 148 H258" pathLength="1" class="fl-line" style="--d:3.3s"/>
      <path d="M206 214 H258" pathLength="1" class="fl-line" style="--d:3.7s"/>
      <path d="M252 386 H258" pathLength="1" class="fl-line" style="--d:4.1s"/>
    </g>
  </svg>
  <div class="call fl-rise" style="top:84px;--d:2.9s"><span class="fl-num">1</span><span>Dial &amp; hands</span></div>
  <div class="call fl-rise" style="top:134px;--d:3.3s"><span class="fl-num">2</span><span>Escapement</span></div>
  <div class="call fl-rise" style="top:200px;--d:3.7s"><span class="fl-num">3</span><span>Gear train</span></div>
  <div class="call fl-rise" style="top:372px;--d:4.1s"><span class="fl-num">4</span><span>Back plate</span></div>
  <div class="tag"><span class="fl-pill fl-drop" style="--d:4.6s">Error: 15 s a day</span></div>
</div>
</div></body></html>
