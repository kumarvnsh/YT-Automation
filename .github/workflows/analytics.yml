name: Private Meta metrics access check
run-name: Private Meta metrics access check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests pyyaml cryptography
      - name: Read-only Meta access probe
        env:
          PROBE_BONUS_ONLY: '1'
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          PROBE_PUBLIC_KEY_B64: 
        run: python scripts/probe_facebook_monetization.py
      - uses: actions/upload-artifact@v4
        with:
          name: private-meta-probe-encrypted
          path: output/private-meta-probe.enc.json
          retention-days: 1
          if-no-files-found: error
