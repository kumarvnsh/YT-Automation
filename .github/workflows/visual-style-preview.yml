name: Visual Style Preview
on:
  workflow_dispatch:
  push:
    branches: [codex/roman-style-previews]
    paths:
      - .github/workflows/visual-style-preview.yml
      - scripts/roman_style_preview.py
      - scripts/roman_storyboard_preview.py
      - scripts/roman_video_preview.py
      - scripts/roman_dynamic_preview.py
      - scripts/roman_dynamic_scene.js
permissions:
  contents: read
  actions: read
jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          python -m pip install Pillow==11.3.0
          npm install --prefix "$RUNNER_TEMP/histold-preview" hyperframes@0.9.41 gsap@3.14.2 three@0.187.0
          "$RUNNER_TEMP/histold-preview/node_modules/.bin/hyperframes" browser ensure
      # Keep narration constant while testing the visual re-edit.
      - name: Retrieve the original measured voice reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43489531477 --repo "$GITHUB_REPOSITORY" --name roman-hypocaust-video-preview --dir "$RUNNER_TEMP/roman-reference"
      - name: Render camera-led 3D preview without publishing
        run: |
          python scripts/roman_dynamic_preview.py --cli "$RUNNER_TEMP/histold-preview/node_modules/.bin/hyperframes" --gsap "$RUNNER_TEMP/histold-preview/node_modules/gsap/dist/gsap.min.js" --three "$RUNNER_TEMP/histold-preview/node_modules/three/build" --reference "$RUNNER_TEMP/roman-reference"
      - name: Upload video, snapshots, timings and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-hypocaust-dynamic-preview
          path: output/roman-dynamic-preview/
          retention-days: 7
      - name: Summarize
        if: always()
        run: |
          echo '## Roman hypocaust: camera-led 3D preview' >> "$GITHUB_STEP_SUMMARY"
          echo '11 camera shots · Floor reveal · Furnace close-up · Underfloor tour · Rising flue' >> "$GITHUB_STEP_SUMMARY"
          echo 'No publishing credentials or paid generation APIs are used.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/roman-dynamic-preview/metrics.json ]; then
            cat output/roman-dynamic-preview/metrics.json >> "$GITHUB_STEP_SUMMARY"
          fi
