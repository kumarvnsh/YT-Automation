<!doctype html><html><head><style>
.k-stage{gap:14px}
.kick{font:600 13px/1 var(--body);letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.hd{margin:0;text-align:center;font-size:38px}
.art{width:468px;height:440px;display:block;overflow:visible}
.note{font:500 16px/1.2 var(--body);fill:var(--ink)}
.small{font:600 12px/1 var(--body);fill:var(--ink);letter-spacing:.16em;opacity:.85}
.big{font:400 46px/1 var(--display);fill:var(--accent)}
.walk{animation:march 9s linear both}
@keyframes march{from{transform:translateX(-150px)}to{transform:translateX(30px)}}
.win{animation:winglow 1.1s ease-in-out infinite alternate}
@keyframes winglow{from{opacity:.45}to{opacity:1}}
.billow{transform-box:fill-box;transform-origin:50% 100%;animation:billow 9s ease-out var(--d,0s) both}
@keyframes billow{from{transform:translateY(40px) scale(.4);opacity:0}20%{opacity:.9}to{transform:translate(-30px,-60px) scale(1.25);opacity:.75}}
.fire{transform-box:fill-box;transform-origin:50% 100%;animation:fireup 1.4s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
@keyframes fireup{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.blaze{animation:blaze 1.6s ease-in-out infinite alternate}
@keyframes blaze{from{opacity:.65}to{opacity:1}}
.in{animation:cinematic-reveal .7s cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
</style></head><body><div class="k-stage">
<div class="kick k-reveal" style="--d:0s">Washington · 24 August 1814</div>
<h1 class="hd k-title k-reveal" style="--d:.2s">The night the library burned</h1>
<svg class="art" viewBox="0 0 468 440">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:color-mix(in srgb,var(--parch) 45%,#000)"/>
      <stop offset=".55" style="stop-color:color-mix(in srgb,var(--parch) 85%,#000)"/>
      <stop offset=".78" style="stop-color:color-mix(in srgb,var(--accent) 55%,var(--parch))"/>
      <stop offset="1" style="stop-color:var(--accent)"/>
    </linearGradient>
    <radialGradient id="heat" cx=".5" cy="1" r=".75">
      <stop offset="0" style="stop-color:var(--ink);stop-opacity:.9"/>
      <stop offset=".25" style="stop-color:var(--accent);stop-opacity:.85"/>
      <stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="smk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:color-mix(in srgb,var(--dim) 55%,#000)"/>
      <stop offset="1" style="stop-color:color-mix(in srgb,var(--accent) 45%,var(--dim))"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:color-mix(in srgb,var(--ink) 75%,var(--accent))"/>
      <stop offset="1" style="stop-color:color-mix(in srgb,var(--ink) 55%,var(--parch))"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--accent)"/>
      <stop offset=".18" style="stop-color:color-mix(in srgb,var(--parch) 35%,#000)"/>
      <stop offset="1" style="stop-color:color-mix(in srgb,var(--parch) 20%,#000)"/>
    </linearGradient>
    <clipPath id="frame"><rect width="468" height="440" rx="16"/></clipPath>
    <g id="flame">
      <path d="M0 0 C-22 -18 -18 -48 -4 -70 C-6 -50 6 -44 8 -54 C6 -78 22 -94 30 -108 C30 -80 46 -64 50 -44 C56 -54 54 -66 52 -74 C70 -50 66 -18 46 0Z" style="fill:var(--accent)"/>
      <path d="M8 0 C-2 -14 2 -32 12 -42 C12 -30 20 -28 22 -34 C24 -48 32 -56 36 -62 C38 -42 46 -30 40 0Z" style="fill:color-mix(in srgb,var(--accent) 40%,var(--ink))"/>
      <path d="M16 0 C12 -10 16 -20 22 -26 C24 -16 30 -12 30 0Z" style="fill:var(--ink)"/>
    </g>
    <g id="wing">
      <rect x="0" y="96" width="150" height="10" style="fill:color-mix(in srgb,var(--ink) 50%,var(--parch))"/>
      <rect x="4" y="30" width="142" height="66" fill="url(#stone)"/>
      <path d="M-4 30 H154 V22 H-4Z" style="fill:color-mix(in srgb,var(--ink) 80%,var(--accent))"/>
      <path d="M-4 22 L75 -6 L154 22Z" style="fill:color-mix(in srgb,var(--ink) 70%,var(--parch))"/>
      <path d="M75 -6 L154 22 H75Z" class="hx-hatch"/>
      <g style="fill:color-mix(in srgb,var(--ink) 92%,#fff)">
        <rect x="46" y="32" width="5" height="62"/><rect x="62" y="32" width="5" height="62"/><rect x="83" y="32" width="5" height="62"/><rect x="99" y="32" width="5" height="62"/>
      </g>
      <path d="M4 68 H146" style="stroke:color-mix(in srgb,var(--ink) 55%,var(--parch));stroke-width:1.2"/>
      <path d="M4 82 H146" style="stroke:color-mix(in srgb,var(--ink) 55%,var(--parch));stroke-width:1"/>
      <g class="win" style="fill:var(--accent)">
        <path d="M14 66 v-18 a7 7 0 0 1 14 0 v18Z"/><path d="M122 66 v-18 a7 7 0 0 1 14 0 v18Z"/>
        <rect x="14" y="74" width="14" height="16"/><rect x="122" y="74" width="14" height="16"/>
        <rect x="69" y="74" width="12" height="16"/>
      </g>
      <path d="M75 30 L150 30 V106 H75" fill="#000" opacity=".22"/>
    </g>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="468" height="440" fill="url(#sky)"/>
    <g style="fill:var(--ink)" opacity=".7">
      <circle cx="40" cy="40" r="1.2"/><circle cx="96" cy="22" r="1"/><circle cx="170" cy="58" r="1.3"/><circle cx="260" cy="30" r="1"/>
      <circle cx="330" cy="70" r="1.2"/><circle cx="420" cy="34" r="1.4"/><circle cx="446" cy="96" r="1"/><circle cx="20" cy="110" r="1"/>
    </g>
    <circle cx="398" cy="78" r="20" style="fill:var(--ink)" opacity=".85"/>
    <circle cx="398" cy="78" r="34" style="fill:var(--ink)" opacity=".12" class="hx-glow"/>
    <!-- far city and trees, lit from below -->
    <g class="hx-far">
      <path d="M-20 318 L0 300 L18 306 L30 286 L52 300 L74 292 L96 306 L128 294 L150 308 L470 308 L490 340 L-20 340Z" style="fill:color-mix(in srgb,var(--parch) 40%,#000)"/>
      <path d="M318 312 q10-46 24-10 q8-40 22-6 q12-52 28-4 q8-30 20 0 q10-36 24 2 L470 314 L470 340 L318 340Z" style="fill:color-mix(in srgb,var(--parch) 30%,#000)"/>
    </g>
    <!-- the heat of the blaze -->
    <ellipse class="blaze hx-glow" cx="234" cy="330" rx="250" ry="150" fill="url(#heat)"/>
    <!-- smoke billows -->
    <g class="hx-wash">
      <g class="billow" style="--d:.6s"><path d="M70 200 c-20 0-30-22-14-34 c-4-22 22-34 36-20 c10-18 40-14 42 6 c22-2 30 26 12 36 c4 18-20 26-34 16 c-10 12-34 10-42-4Z" fill="url(#smk)"/></g>
      <g class="billow" style="--d:1.8s"><path d="M290 190 c-24 0-36-26-16-40 c-6-26 26-40 44-24 c12-22 48-16 50 8 c26-2 36 30 14 42 c4 22-24 30-40 18 c-12 14-40 12-52-4Z" fill="url(#smk)"/></g>
      <g class="billow" style="--d:3.2s"><path d="M170 130 c-26 0-40-30-18-46 c-6-30 30-46 50-28 c14-24 54-18 56 10 c30-2 40 34 16 48 c4 24-26 34-46 20 c-14 16-46 14-58-4Z" fill="url(#smk)"/></g>
    </g>
    <!-- the Capitol, 1814: two wings joined by a wooden walkway, no dome yet -->
    <g class="hx-shadow hx-ink">
      <rect x="160" y="292" width="148" height="44" style="fill:color-mix(in srgb,var(--ink) 40%,var(--parch))"/>
      <path d="M160 292 h148 M172 292 v44 M190 292 v44 M208 292 v44 M226 292 v44 M244 292 v44 M262 292 v44 M280 292 v44 M298 292 v44" style="stroke:color-mix(in srgb,var(--parch) 40%,#000);stroke-width:1.4" fill="none"/>
      <use href="#wing" x="18" y="232"/>
      <use href="#wing" x="300" y="232"/>
    </g>
    <!-- fire takes the roofs: the north wing (the library) first -->
    <g class="fire" style="--d:1s"><use href="#flame" x="48" y="228" class="hx-flicker"/></g>
    <g class="fire" style="--d:1.6s"><use href="#flame" x="104" y="226" class="hx-flicker" style="animation-delay:.25s"/></g>
    <g class="fire" style="--d:2.8s"><use href="#flame" x="332" y="228" class="hx-flicker" style="animation-delay:.4s"/></g>
    <g class="fire" style="--d:3.4s"><use href="#flame" x="388" y="226" class="hx-flicker" style="animation-delay:.1s"/></g>
    <!-- pages and embers rise from the library -->
    <g style="fill:var(--ink)">
      <rect class="hx-rise" x="64" y="282" width="12" height="15" rx="1" style="--d:3s;--x:-34px;--r:200deg"/>
      <rect class="hx-rise" x="100" y="290" width="10" height="13" rx="1" style="--d:3.6s;--x:26px"/>
      <rect class="hx-rise" x="82" y="296" width="11" height="14" rx="1" style="--d:4.4s;--x:-16px;--r:-160deg"/>
      <rect class="hx-rise" x="120" y="286" width="9" height="12" rx="1" style="--d:5.2s;--x:40px"/>
      <rect class="hx-rise" x="72" y="290" width="12" height="15" rx="1" style="--d:6s;--x:-44px"/>
    </g>
    <g style="fill:var(--accent)">
      <circle class="hx-rise" cx="90" cy="230" r="2" style="--d:1.4s;--x:-20px;--t:4s"/><circle class="hx-rise" cx="120" cy="226" r="1.6" style="--d:2.2s;--x:18px;--t:4s"/>
      <circle class="hx-rise" cx="360" cy="230" r="2" style="--d:3.2s;--x:-24px;--t:4s"/><circle class="hx-rise" cx="400" cy="226" r="1.6" style="--d:4.2s;--x:16px;--t:4s"/>
      <circle class="hx-rise" cx="80" cy="236" r="1.4" style="--d:5s;--x:30px;--t:4s"/><circle class="hx-rise" cx="380" cy="232" r="1.8" style="--d:6s;--x:-30px;--t:4s"/>
    </g>
    <!-- foreground: rim-lit ground and the column of redcoats -->
    <g class="hx-near">
      <path d="M-40 352 q130-26 260-6 t300-8 L520 460 L-40 460Z" fill="url(#rim)"/>
      <path d="M380 352 q16-60 34-6 q12-44 28 2 q14-30 30 6Z" style="fill:color-mix(in srgb,var(--parch) 15%,#000)"/>
      <g class="walk">
        <g id="soldier">
          <path d="M60 372 l-4 26 h4 l3-16 l3 16 h4 l-4-26Z" style="fill:color-mix(in srgb,var(--parch) 15%,#000)"/>
          <path d="M55 352 h12 l2 22 h-16Z" style="fill:color-mix(in srgb,var(--accent) 70%,#7a1d1d)"/>
          <path d="M55 352 h2 l-1 22 h-3Z" style="fill:var(--accent)"/>
          <rect x="56" y="341" width="10" height="11" rx="2" style="fill:color-mix(in srgb,var(--parch) 15%,#000)"/>
          <path d="M70 354 l3-34 h1.4 l-2.4 34Z" style="fill:var(--ink)" opacity=".8"/>
        </g>
        <use href="#soldier" x="28"/><use href="#soldier" x="56"/><use href="#soldier" x="84"/><use href="#soldier" x="112"/><use href="#soldier" x="140"/>
      </g>
    </g>
  </g>
  <rect width="468" height="440" rx="16" fill="none" class="hx-ink" style="stroke:var(--ink);stroke-width:1.4;opacity:.45"/>
  <!-- annotations -->
  <g class="in" style="--d:2.6s">
    <path class="k-draw" pathLength="1" d="M66 54 C40 120 60 220 80 286" fill="none" style="stroke:var(--ink);stroke-width:1.5;--d:2.6s;--t:.9s"/>
    <circle cx="80" cy="288" r="4" style="fill:var(--ink)"/>
    <text class="note" x="24" y="44">The library: north wing</text>
  </g>
  <g class="in" style="--d:5.4s">
    <rect x="296" y="364" width="156" height="68" rx="10" style="fill:color-mix(in srgb,var(--parch) 55%,#000)" opacity=".8"/>
    <text class="big" x="374" y="404" text-anchor="middle">3,000</text>
    <text class="small" x="374" y="424" text-anchor="middle">VOLUMES LOST</text>
  </g>
</svg>
</div></body></html>
