name: Tests

# Runs on code changes only. The scheduled analytics/publish jobs commit to
# data/ constantly and carry [skip ci], so they never reach this workflow.
on:
  push:
    branches: [master]
    paths-ignore:
      - "data/**"
      - "output/**"
      - "logs/**"
  pull_request:
    paths-ignore:
      - "data/**"
      - "output/**"
      - "logs/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium for cinematic layout regression
        run: python -m playwright install --with-deps chromium

      # Every external service boundary (LLM, TTS, Pexels, ffmpeg, YouTube, HTTP) is
      # patched in the suite, so this needs no secrets and makes no network
      # calls. The cinematic layout regression uses local Chromium.
      # ffmpeg is deliberately not installed — if a test ever needs it,
      # that test is reaching a boundary it should be mocking.
      # Pytest collects both unittest classes and standalone test functions.
      # Keep a minimum collection count so partial discovery cannot pass silently.
      - name: Run tests
        run: |
          python -m pytest tests -v --junitxml=output/test-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("output/test-results.xml").getroot().findall(".//testcase")
          print(f"collected {len(cases)} test results")
          if len(cases) < 80:
              raise SystemExit(f"expected at least 80 tests, collected {len(cases)} — discovery is broken")
          PY
