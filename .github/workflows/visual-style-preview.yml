name: Visual Style Preview
on:
  workflow_dispatch:
  push:
    branches: [codex/roman-style-previews]
    paths:
      - .github/workflows/visual-style-preview.yml
      - scripts/roman_style_preview.py
      - scripts/roman_storyboard_preview.py
      - scripts/roman_video_preview.py
permissions:
  contents: read
jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          python -m pip install Pillow==11.3.0
          npm install --prefix "$RUNNER_TEMP/histold-preview" hyperframes@0.9.41 gsap@3.14.2
          "$RUNNER_TEMP/histold-preview/node_modules/.bin/hyperframes" browser ensure
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: roman-preview-kokoro-v1-${{ runner.os }}
      - name: Install production CPU voice worker
        run: |
          python -m venv .venv-kokoro
          .venv-kokoro/bin/python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .venv-kokoro/bin/python -m pip install -r requirements-kokoro.txt
          echo "KOKORO_PYTHON=$GITHUB_WORKSPACE/.venv-kokoro/bin/python" >> "$GITHUB_ENV"
      - name: Render narrated cinematic preview without publishing
        run: |
          python scripts/roman_video_preview.py --cli "$RUNNER_TEMP/histold-preview/node_modules/.bin/hyperframes" --gsap "$RUNNER_TEMP/histold-preview/node_modules/gsap/dist/gsap.min.js"
      - name: Upload video, snapshots, timings and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-hypocaust-video-preview
          path: output/roman-video-preview/
          retention-days: 7
      - name: Summarize
        if: always()
        run: |
          echo '## Roman hypocaust: narrated cinematic preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'Floor reveal · External furnace · Hot-air route · Complete system' >> "$GITHUB_STEP_SUMMARY"
          echo 'No publishing credentials or paid generation APIs are used.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/roman-video-preview/metrics.json ]; then
            cat output/roman-video-preview/metrics.json >> "$GITHUB_STEP_SUMMARY"
          fi
