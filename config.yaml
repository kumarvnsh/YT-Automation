# ===========================================================================
# YT-Automation configuration
# Edit this file to change the channel niche, video style, and providers.
# Anything secret (API keys) lives in .env, NOT here.
# ===========================================================================

channel:
  niche: "Surprising World History / Did-you-know"
  # High-level instruction handed to the script writer. Tune the voice here.
  persona: >
    You write punchy, accurate, surprising history and 'did you know' content.
    Explain surprising origins, forgotten people, misconceptions and real
    decisions from around the world. Start with a specific surprise, explain
    it promptly and finish with a satisfying answer. Use accessible English,
    clear context and a warm documentary voice. Avoid graphic detail, forced
    outrage and clickbait. Never withhold the answer for another video.
  language: "en"
  # Extra script rules (appended to the task context).
  content_rules: >
    Every number and claim must be one you are confident is true; if unsure,
    cut it. The hook must be literally true, not a dramatisation ("engineers
    feared it couldn't stop" only if engineers really said so). Write for the
    ear: short sentences, one idea each, no parentheses or lists. Each segment
    is shown as its own on-screen scene, so it must make sense on its own.
    Respect the differences between countries, cultures and periods. Explain
    unfamiliar names and show readable maps or diagrams. Never present an
    illustration as archival evidence. Avoid rapid flashes, dense text and
    unexplained jargon. No generic comment bait or forced sides.
  # Evergreen by default; anniversaries are optional rather than the topic driver.
  topic_source: "angles"
  trend_region: "global"
  # Topics already used are stored in data/used_topics.json to avoid repeats.

# Recurring named series. Every Nth video becomes an episode: it ignores the
# trend signals and follows series.direction instead, and its title carries
# " | <name>" so the run is recognisable. Blank name disables the series.
series:
  name: "History's Almost Moments"
  every: 3                       # 1 = every video, 3 = every third
  direction: ""                  # blank = built-in counterfactual brief

editorial:
  enabled: true                 # new automatic Histold Shorts only; manual topics stay fixed
  primary_platform: "facebook"
  experiment_id: "facebook-world-history-4w"
  experiment_posts: 56          # first 56 reserved automatic assignments, about four weeks at 2/day
  regions:
    - {id: "india", label: "India", guidance: "Origins, daily life, inventions and forgotten people across distinct Indian periods and communities"}
    - {id: "africa", label: "African countries", guidance: "Rotate specific countries such as Nigeria, South Africa, Kenya, Ethiopia, Ghana and Egypt; avoid continent-wide generalizations"}
    - {id: "japan", label: "Japan", guidance: "Everyday customs, material culture, inventions and historical choices"}
    - {id: "china", label: "China", guidance: "Documented everyday origins, inventions, trade, art and daily life across named periods and communities; corroborate first-invention claims independently"}
    - {id: "russia", label: "Russia and its historical contexts", guidance: "Distinguish Russian, Soviet and neighboring histories; use independent corroboration for contested claims"}
    - {id: "middle_east", label: "the Middle East", guidance: "Name a specific country, culture and period; explore everyday origins, scholarship and trade without modern political provocation"}
    - {id: "europe", label: "Europe", guidance: "Rotate countries, ordinary life, forgotten people and unexpected connections"}
    - {id: "americas", label: "the Americas", guidance: "Include North, Central and South America and named Indigenous communities; retain existing US/Canada audience relevance"}
    - {id: "asia_pacific", label: "other Asian and Pacific countries", guidance: "Include the Philippines, Korea, Southeast Asia and Pacific communities; explain distinct cultures precisely"}
  series:
    - id: "everyday_origins"
      name: "You Use It Every Day"
      direction: "The surprising documented history of food, words, objects, inventions or customs, including cross-cultural connections and daily life"
    - id: "myth_evidence"
      name: "History Got This Wrong"
      direction: "A documented misconception or overlooked person; use evidence, avoid inventing a popular myth just to debunk it"
    - id: "decisions"
      name: "One Decision Changed Everything"
      direction: "A verified choice or near-miss with an actual documented consequence; no invented alternate timelines or exaggerated sole-cause claims"
  duration_variants:
    - {id: "concise", seconds: 30}
    - {id: "story", seconds: 50}

production:
  enabled: true              # New Histold shorts only; settings snapshotted per stage
  strict_timing: true
  experiment: false           # legacy six-Reel study stays archived; editorial rotation replaces it

research:
  max_searches: 5
  model: "claude-sonnet-4-6"
  regional_source_leads:
    india:
      - "https://www.vam.ac.uk/articles/indian-textiles/"
      - "https://www.vam.ac.uk/blog/fabric-of-india/guest-post-indian-chintz-a-legacy-of-luxury"
  publisher_aliases: {"qdl.qa": "qnl.qa"}  # related collections do not count as independent corroboration
  authoritative_domains: ["loc.gov", "archives.gov", "si.edu", "nps.gov", "history.state.gov", "canada.ca", "statcan.gc.ca", "mnhs.org", "historylink.org", "noaa.gov", "usgs.gov", "nasa.gov", "nationalarchives.gov.uk", "bl.uk", "iwm.org.uk", "nationalarchives.nic.in", "nich.go.jp", "nationalarchives.gov.za", "museums.or.ke", "hermitagemuseum.org", "qdl.qa", "qnl.qa", "dpm.org.cn", "chnmuseum.cn", "vam.ac.uk", "britishmuseum.org"]

audio_quality:
  silence_db: -40
  silence_duration: 0.8
  endpoint_tolerance: 0.15
  max_edge_silence: 0.8

script:
  story_profile: "consequence_first"
  provider: "anthropic"        # primary provider: "anthropic" | "openai"
  routing: "fallback"          # "fallback" | "random" | "round_robin"
  fallback_provider: "openai"
  anthropic_model: "claude-sonnet-5-5"   # cheaper per token than 4.6
  anthropic_effort: "low"      # thinking on, so word budgets land first try; unset = old no-thinking call
  openai_model: "gpt-4o-mini"
  # Require the four-beat looping structure (hook / setup / pivot / fact stack
  # / callback) on every short, enforced at generation and again at the quality
  # gate. Derived from the only Histold shorts that exceeded 100% average view
  # percentage. Needs shorts_target_seconds >= 45 to fit the beats.
  enforce_beats: true
  # Target spoken duration. The writer aims for ~150 words/min.
  # Legacy/manual target. Editorial snapshots test 30s and 50s separately on Facebook;
  # prior YouTube retention patterns do not establish Facebook's preferred duration.
  shorts_target_seconds: 45
  longform_target_seconds: 420   # 7 minutes

tts:
  alignment_provider: "openai" # Used only if measured native timing is absent/inconsistent
  provider: "kokoro"           # CPU open-weight narrator; Edge fallback
  kokoro_voice: "am_michael"
  kokoro_speed: 0.95
  kokoro_timeout: 300          # seconds, including cold model downloads
  edge_voice: "en-US-GuyNeural"        # try en-US-AriaNeural, en-GB-RyanNeural
  edge_rate: "+8%"
  elevenlabs_voice_id: "21m00Tcm4TlvDq8ikWAM"   # only used if provider=elevenlabs
  openai_voice: "onyx"                          # only used if provider=openai

assets:
  provider: "pexels"           # "pexels" (videos+photos)
  per_segment_clips: 3
  prefer_video: true           # use stock video clips; fall back to photos
  orientation_short: "portrait"
  orientation_long: "landscape"
  # Generate one topical illustration per segment (shorts only) instead of
  # pulling generic stock. Any failure falls back to the Pexels chain below,
  # so this can never break a run.
  ai_images:
    enabled: true
    # "illustrative" and "painterly" render engraved/painted plates. YouTube
    # requires disclosure only for synthetic media a viewer could mistake for
    # real footage, so these carry NO disclosure obligation and never present
    # a fabricated image as evidence of a real person or event.
    # "photoreal" gives up both protections: if you switch to it you must tick
    # "altered or synthetic content" on every upload.
    style: "histold_hybrid"    # painterly + propaganda-poster + graphic-novel blend
    # Which beats get a generated still; every other beat keeps moving stock
    # footage. A short built entirely from stills reads as a slideshow, so
    # images are spent where specificity pays — the pivot and the fact stack,
    # which make concrete claims — while hook/setup/callback keep motion.
    # Set to [] to generate an image for every segment instead.
    beats: []                  # every beat — fully generated look, no stock
    # Hard cap on generated images per video. When fewer than the eligible
    # beats, the survivors are spread evenly across them (the pivot is always
    # kept) so the stills don't bunch up in one stretch of the short.
    # 0 = no cap. At 2 this is the pivot and the final, strongest fact.
    max_images: 8              # budget cap: ~8 low-quality stills ≈ $0.08-0.16/short
    model: "gpt-image-1"       # uses the existing OPENAI_API_KEY
    size: "1024x1536"          # portrait, matches the 1080x1920 short
    quality: "low"             # "low" | "medium" | "high" — cost scales with this
    # Per-image hard timeout. A hung request falls back to stock footage
    # instead of stalling a time-budgeted run.
    timeout_seconds: 90
    # Cost note: max_images caps spend per video. Multiply by your upload
    # cadence (currently 2/day: cron-job.org dispatches morning + evening)
    # and check current per-image pricing before raising it.

video:
  branding:
    enabled: true
  short:
    width: 1080
    height: 1920
    fps: 30
  long:
    width: 1920
    height: 1080
    fps: 30
  encode:
    preset: "veryfast"         # ffmpeg x264 preset; faster = quicker render, slightly larger file
    crf: 23                    # 18-28; lower = higher quality/larger. 23 is a good balance
  # Visual mode for SHORTS: "mascot" (talking owl on branded bg) or "broll" (stock footage).
  # Long-form always uses b-roll (mascot full-frame render is too heavy for 7-min videos).
  # "claude_motion": Claude writes an animated HTML scene per segment, rendered
  # frame-by-frame in headless Chromium (~$0.07/short on Sonnet 5.5 medium).
  # Failed scenes fall back to stock. "broll" = previous stock/AI-image look.
  # VIDEO_MODE env overrides this for a single run.
  mode: "claude_motion"
  claude_motion:
    model: "claude-sonnet-5-5"
    effort: "medium"           # "low" came out bare (~$0.05); "high" thinks far past the budget
    max_tokens: 30000          # hard cost cap (~$0.30 on Sonnet 5.5); cut-off scenes fall back to stock
  # Image motion + transitions (applies to the broll/AI-image render path).
  motion: "pan"               # "pan" (zoom + drift) | "kenburns" (zoom) | "stopmotion" (wobble)
  transition: "fade"          # crossfade between beats; "" = hard cuts
  transition_seconds: 0.4
  color_grade:
    enabled: true
    filter: "eq=contrast=1.05:saturation=0.9:gamma=0.95"
  mascot:
    dir: "Mascot"              # (unused while mode is broll; kept if you switch back)
    scale: 0.48
    margin_right: 30
    margin_bottom: 230
  captions:
    enabled: true
    font: "Arial"
    fontsize_short: 96               # real pixels (subtitle canvas = video resolution)
    fontsize_long: 56
    outline: 6
    words_per_beat: 4                 # words grouped per caption card (3-6 typical for fast-paced shorts)
    margin_bottom: 220               # px from bottom (broll mode)
    margin_top: 380                  # px from top (mascot mode, clear of the corner owl)
    primary_color: "&H00FFFFFF"      # white  (ASS BGR hex)
    outline_color: "&H00000000"      # black outline
  background_music:
    enabled: true
    # Drop royalty-free .mp3 files in assets/music/. One is picked at random.
    volume: 0.12

thumbnails:
  # Custom thumbnail per video (Shorts support these since Jul 2026, YPP only;
  # one per Short, no Test & Compare). Two compositions are generated in the
  # house style and Claude picks one; the other stays in the stage dir.
  enabled: true
  model: "gpt-image-1"         # uses OPENAI_API_KEY
  quality: "medium"            # ~2 x $0.06 per video at medium portrait; style is in src/thumbnail.py
  judge_model: "claude-sonnet-5-5"

quality:
  # Deterministic local checks run after compose and before upload. A failed
  # check blocks the upload; the report is saved to <stage>/quality.json.
  enabled: true
  min_duration_ratio: 0.75     # video/voiceover + narration/target lower bound
  max_duration_ratio: 1.35     # ...and upper bound
  banned_terms: ["graphic sexual", "extreme gore"]

youtube:
  enabled: true
  privacy_status: "public"     # "private" | "unlisted" | "public"
  category_id: "27"            # 27 = Education
  made_for_kids: false
  # Safety lock: uploads abort unless the authorized channel matches this ID.
  # This is the Histold channel. Leave blank to disable the check.
  expected_channel_id: "UCJImBb1E8e0llDt8ISdF_1g"
  default_tags: ["world history", "did you know", "historical facts", "history shorts", "education", "everyday origins"]

republish:
  # Auto-repost stuck videos: checked after every analytics export (~6h).
  # One auto attempt per video ever; manual dashboard buttons unaffected.
  auto: true
  view_threshold: 100     # flag videos still under this many views...
  min_age_hours: 30       # ...this long after publish (24h rule + 6h analytics lag)
  max_age_days: 13        # repost needs the render artifact (14d retention, 1d margin)
  max_per_check: 1        # dispatch at most this many republishes per analytics run
  mode: repost            # repost (delete + re-upload, new title) | retitle (title swap only)

meta:
  # Cross-post rendered shorts to Facebook Reels + Instagram Reels via the Graph
  # API. Requires the META_ACCESS_TOKEN secret (non-expiring System User token).
  # Facebook is primary for Histold Shorts: a missing Facebook Reel ID fails the
  # upload step for retry, and successful platform IDs are reused on retry.
  enabled: true                # master switch; every short cross-posts to FB + IG (scheduled + manual)
  primary: true
  post_to_facebook: true
  post_to_instagram: true
  page_id: "1194740133719930"          # Histold Facebook Page
  ig_user_id: "17841410834243353"      # Histold Instagram business account
  api_version: "v21.0"
  hashtags: ["#WorldHistory", "#Histold"]
  facebook_caption:
    enabled: true
    hashtags: ["#WorldHistory", "#Histold"]

notifications:
  enabled: true                # master switch for WhatsApp alerts
  channel: "openwa"            # currently only OpenWA is implemented
  notify_on_start: false       # ping when a daily run begins
  notify_on_success: true      # ping when a video uploads (or renders, if no-upload)
  notify_on_failure: true      # ping on any failure
  notify_on_credits: true      # special alert when AI credits run out / flow stops

output:
  dir: "output"                # rendered videos + metadata land here
  delete_after_upload: true    # once uploaded to YouTube, delete the local renders (saves disk)
  keep_days: 3                 # also prune leftover run folders older than this many days
