name: Publish Video
run-name: ${{ inputs.dry_run && 'Histold script preview' || inputs.no_upload && 'Histold render preview' || 'Publish Video' }}

on:
  # Scheduling is handled by the always-on laptop (scripts/dispatch.py, hourly), which
  # dispatches this workflow with inputs.scheduled=true at the growth plan's hours.
  # GitHub's own cron was dropped: it fired 47-204min late or not at all.
  workflow_dispatch:
    inputs:
      format:
        description: "Video format"
        type: choice
        options: [short, long, both]
        default: short
      topic:
        description: "Override today's topic (optional) — leave blank for trend-driven auto pick"
        type: string
        required: false
        default: ""
      privacy_status:
        description: "Override youtube.privacy_status (optional)"
        type: choice
        options: ["", private, unlisted, public]
        default: ""
      dry_run:
        description: "Script + metadata only, no render/upload"
        type: boolean
        default: false
      no_upload:
        description: "Render but don't upload (approval-queue draft)"
        type: boolean
        default: false
      scheduled:
        description: "Set by the external cron trigger — enables the duplicate-slot guard"
        type: boolean
        default: false
      dispatch_slot:
        description: "Original UTC dispatch hour"
        type: string
        default: ""

concurrency:
  group: publish-histold
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # duplicate-slot guard lists runs and cancels its own

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VIDEO_3D: ${{ vars.HISTOLD_3D || 'off' }}
      VIDEO_MODE: ${{ vars.VIDEO_MODE }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      YOUTUBE_CLIENT_SECRET_FILE: secrets/client_secret.json
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}   # used to host the mp4 as a public release asset for Meta to pull
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before the gate: runner system Python refuses pip installs (PEP 668).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Claim publication
        if: inputs.dry_run != true && inputs.no_upload != true
        env:
          DISPATCH_SLOT: ${{ inputs.dispatch_slot }}
          PUBLISH_SCHEDULED: ${{ inputs.scheduled }}
          VIDEO_FORMAT: ${{ inputs.format }}
        run: |
          python -c 'import yaml' 2>/dev/null || python -m pip install --quiet pyyaml
          CLAIM="run-$GITHUB_RUN_ID"
          if [ "$PUBLISH_SCHEDULED" = true ]; then CLAIM="slot-$DISPATCH_SLOT"; fi
          python scripts/claim_histold_publish.py "$VIDEO_FORMAT" "$CLAIM"

      - uses: actions/setup-node@v4
        if: github.event.inputs.dry_run != 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned 3D renderer
        if: github.event.inputs.dry_run != 'true'
        run: |
          npm ci
          echo "HYPERFRAMES_CLI=$GITHUB_WORKSPACE/node_modules/.bin/hyperframes" >> "$GITHUB_ENV"

      - name: Install ffmpeg
        if: github.event.inputs.dry_run != 'true'
        timeout-minutes: 6
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "Using the runner's existing FFmpeg installation."
            ffmpeg -version
            exit 0
          fi
          if timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update              && timeout 90 sudo apt-get -o DPkg::Lock::Timeout=30 -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y ffmpeg; then
            echo "Installed FFmpeg from Ubuntu packages."
          else
            # The Ubuntu mirror has stalled at a few kB/s (19 Nov 2026). GitHub release
            # downloads stay fast on Actions runners, so fall back to a static build.
            echo "Ubuntu FFmpeg install failed or timed out; using a static build."
            url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            curl -fsSL --retry 3 --max-time 120 "$url" -o /tmp/ffmpeg.tar.xz
            sudo tar -xJf /tmp/ffmpeg.tar.xz -C /usr/local/bin --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          command -v ffmpeg && command -v ffprobe
          ffmpeg -hide_banner -version | head -1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Kokoro and alignment models
        if: github.event.inputs.dry_run != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub/checkpoints
          key: kokoro-v2-${{ runner.os }}-${{ hashFiles('requirements-kokoro.txt') }}

      - name: Install CPU Kokoro worker
        if: github.event.inputs.dry_run != 'true'
        id: kokoro_setup
        continue-on-error: true # Edge remains available if optional model setup fails.
        timeout-minutes: 10
        run: |
          python -m venv .venv-kokoro
          .venv-kokoro/bin/python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          .venv-kokoro/bin/python -m pip install -r requirements-kokoro.txt
          echo "KOKORO_PYTHON=$GITHUB_WORKSPACE/.venv-kokoro/bin/python" >> "$GITHUB_ENV"

      - name: Report Kokoro setup fallback
        if: steps.kokoro_setup.outcome == 'failure'
        run: echo 'Kokoro setup failed; narration will use the Edge fallback.'

      # Both 2D scenes and HyperFrames use Chromium.
      - name: Install Chromium
        if: github.event.inputs.dry_run != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Reconstruct YouTube credentials
        env:
          YT_CLIENT_SECRET_JSON_B64: ${{ secrets.YT_CLIENT_SECRET_JSON_B64 }}
          YT_TOKEN_JSON_B64: ${{ secrets.YT_TOKEN_JSON_B64 }}
        run: |
          mkdir -p secrets
          echo "$YT_CLIENT_SECRET_JSON_B64" | base64 -d > secrets/client_secret.json
          echo "$YT_TOKEN_JSON_B64" | base64 -d > secrets/token.json

      - name: Run pipeline (time-budgeted --step loop)
        id: run_pipeline
        env:
          PUBLISH_SCHEDULED: ${{ github.event.inputs.scheduled }}
          PUBLISH_WORKFLOW: publish
          # Keep the completed stage on the runner until upload-artifact runs.
          PRESERVE_STAGE_ARTIFACT: "true"
        run: |
          FORMAT="${{ github.event.inputs.format || 'short' }}"
          TOPIC="${{ github.event.inputs.topic }}"
          PRIVACY="${{ github.event.inputs.privacy_status }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          NO_UPLOAD="${{ github.event.inputs.no_upload }}"

          # Label jobs by IST period; each dispatch reserves topics by unique job ID.
          HOUR_IST=$(TZ=Asia/Kolkata date +%H)
          if [ "$HOUR_IST" -lt 14 ]; then
            export PUBLISH_SLOT=morning
          else
            export PUBLISH_SLOT=evening
          fi
          echo "Using publish slot: $PUBLISH_SLOT"

          ARGS=(--format "$FORMAT" --step)
          [ -n "$TOPIC" ] && ARGS+=(--topic "$TOPIC")
          [ -n "$PRIVACY" ] && ARGS+=(--privacy "$PRIVACY")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          [ "$NO_UPLOAD" = "true" ] && ARGS+=(--no-upload)

          STATUS="TIMEOUT"
          END=$((SECONDS + 5*3600))
          while [ $SECONDS -lt $END ]; do
            set +e
            OUT=$(python -m src.main "${ARGS[@]}" 2>&1)
            PY_STATUS=$?
            set -e
            echo "$OUT"
            if [ "$PY_STATUS" -ne 0 ]; then STATUS="ERROR"; break; fi
            if echo "$OUT" | grep -q "STATUS: DONE"; then STATUS="DONE"; break; fi
            if echo "$OUT" | grep -q "STATUS: ERROR"; then STATUS="ERROR"; break; fi
          done
          echo "pipeline_status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "DONE" ]; then
            echo "Pipeline did not complete successfully: $STATUS"
            exit 1
          fi

      - name: Resolve stage directory
        id: stage
        if: always()
        run: |
          STAGE_DIR=$(ls -td output/*/ 2>/dev/null | head -1 || true)
          STAGE_NAME=$(basename "${STAGE_DIR%/}" 2>/dev/null || true)
          echo "stage_dir=$STAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "stage_name=$STAGE_NAME" >> "$GITHUB_OUTPUT"
          TITLE=$(python -c "import json,sys; print(json.load(open(sys.argv[1])).get('title',''))" "${STAGE_DIR}metadata.json" 2>/dev/null || true)
          {
            echo "title<<EOF_TITLE"
            echo "$TITLE"
            echo "EOF_TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Record pending approval
        if: ${{ github.event.inputs.no_upload == 'true' && steps.run_pipeline.outputs.pipeline_status == 'DONE' }}
        env:
          STAGE_NAME: ${{ steps.stage.outputs.stage_name }}
          TITLE: ${{ steps.stage.outputs.title }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/pending_approvals.json")
          entries = json.loads(path.read_text()) if path.exists() else []
          entries.append({
              "run_id": os.environ["RUN_ID"],
              "stage_dir_name": os.environ["STAGE_NAME"],
              "title": os.environ.get("TITLE", ""),
              "created": datetime.now(timezone.utc).isoformat(),
          })
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(entries, indent=2))
          PYEOF

      - name: Commit dedup state
        if: always() && steps.run_pipeline.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Concurrent runs (the other publish slot, analytics, republish) also
          # append to these JSON lists; a plain commit+rebase dies on content
          # conflicts. Union-merge with origin instead, then rebuild the commit
          # directly on the origin tip so it always applies cleanly.
          for attempt in 1 2 3; do
            git fetch origin master
            python scripts/merge_json_state.py --ref origin/master
            git reset --mixed origin/master
            git add data/used_topics.json data/pending_approvals.json data/published_index.json data/topic_reservations.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No changes to commit."
              break
            fi
            git commit -m "chore: update used topics / approval queue [skip ci]"
            if git push origin HEAD:master; then
              break
            fi
            echo "Push raced with another run (attempt $attempt) — refetching and remerging."
          done

      - name: Upload run artifact (also used by approve.yml for no-upload drafts)
        if: always() && steps.stage.outputs.stage_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ steps.stage.outputs.stage_name }}
          path: ${{ steps.stage.outputs.stage_dir }}
          retention-days: 14
          if-no-files-found: ignore

      # A run that fails before anything is uploaded gives its daily slot back.
      # The script keeps the claim if the stage or index shows any platform ID.
      - name: Release unused publication claim
        if: failure() && env.PUBLISH_CLAIM != ''
        env:
          STAGE_DIR: ${{ steps.stage.outputs.stage_dir }}
        run: python scripts/claim_histold_publish.py --release "$PUBLISH_CLAIM" "$STAGE_DIR"
