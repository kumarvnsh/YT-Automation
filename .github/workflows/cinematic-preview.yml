name: Cinematic 2D Preview
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Existing publish run to reuse (never uploads)
        required: true
        default: '43554497372'
      style:
        description: Visual style for this unpublished preview
        type: choice
        options: [cinematic, woodblock]
        default: cinematic
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '43554497372' }}
          path: output/cinematic-preview
      - name: Render unpublished cinematic draft
        env:
          PREVIEW_STYLE: ${{ inputs.style }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.cinematic_preview output/cinematic-preview "$PREVIEW_STYLE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: histold-${{ inputs.style }}-preview
          path: output/cinematic-preview
          retention-days: 14
